<div style="font-family: Arial, sans-serif; max-width: 560px; color: #0b0d0e;">
  <div style="background: #0b0d0e; color: #9bee37; padding: 18px 22px; border-radius: 10px 10px 0 0; font-size: 18px; letter-spacing: 2px;">
    DEKOR &amp; DESIGN · GARDE-CORPS
  </div>
  <div style="border: 1px solid #dde7e5; border-top: 0; padding: 22px; border-radius: 0 0 10px 10px;">
    <h2 style="margin: 0 0 16px; font-weight: 500;">Nouvelle demande de devis</h2>
    <table style="width: 100%; border-collapse: collapse; font-size: 15px;">
      <tr><td style="padding: 6px 0; color: #5b6462; width: 140px;">Nom</td><td><b>{{nom}}</b></td></tr>
      <tr><td style="padding: 6px 0; color: #5b6462;">Téléphone</td><td><b>{{telephone}}</b></td></tr>
      <tr><td style="padding: 6px 0; color: #5b6462;">Email</td><td>{{email}}</td></tr>
      <tr><td colspan="2"><hr style="border: 0; border-top: 1px solid #dde7e5; margin: 10px 0;"></td></tr>
      <tr><td style="padding: 6px 0; color: #5b6462;">Modèle</td><td><b>{{modele}}</b></td></tr>
      <tr><td style="padding: 6px 0; color: #5b6462;">Projet</td><td>{{projet}}</td></tr>
      <tr><td style="padding: 6px 0; color: #5b6462;">Finition</td><td>{{finition}}</td></tr>
      <tr><td style="padding: 6px 0; color: #5b6462;">Longueur</td><td>{{longueur}} m</td></tr>
      <tr><td style="padding: 6px 0; color: #5b6462;">Hauteur</td><td>{{hauteur}} cm</td></tr>
      <tr><td style="padding: 6px 0; color: #5b6462;">Ville du chantier</td><td>{{ville}}</td></tr>
    </table>
    <p style="margin: 16px 0 6px; color: #5b6462;">Précisions</p>
    <p style="margin: 0; white-space: pre-line;">{{message}}</p>
  </div>
</div>
